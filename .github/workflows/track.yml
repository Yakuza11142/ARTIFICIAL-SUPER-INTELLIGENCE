name: Phone Number Tracking Pipeline

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab in GitHub
  push:
    branches: [ main, master ]

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & APIs via Pip
        run: |
          python -m pip install --upgrade pip
          pip install phonenumbers requests

      - name: Execute Tracking Script
        env:
          TARGET_PHONE: "+2349163349757"
        run: python track_number.py
