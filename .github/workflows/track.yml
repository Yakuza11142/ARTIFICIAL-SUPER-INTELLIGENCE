name: Advanced Number Tracker Pipeline

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  push:
    branches: [ main, master ]

jobs:
  track-number:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies via Pip
        run: |
          python -m pip install --upgrade pip
          pip install phonenumbers requests

      - name: Execute Advanced Tracking Script
        env:
          TARGET_PHONE: "+2349163349757"
          # Optional: Add your commercial API key under GitHub Repository Secrets named LOOKUP_API_KEY
          LOOKUP_API_KEY: ${{ secrets.LOOKUP_API_KEY }}
          LOOKUP_API_ENDPOINT: ${{ secrets.LOOKUP_API_ENDPOINT }}
        run: python track_number.py
